<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Ювелирные изделия</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Лайк/Дизлайк -->
    <div class="reactions">
        <button class="like-btn" onclick="like()">👍 Лайк</button>
        <button class="dislike-btn" onclick="dislike()">👎 Дизлайк</button>
        <div class="reactions-count">
            Лайков: <span id="likeCount">0</span> | 
            Дизлайков: <span id="dislikeCount">0</span>
        </div>
    </div>

    <!-- Хэштег и соцсети -->
    <section class="social-header">
        <div class="hashtag">#ojjo_jewerly</div>
        <div class="social-title">Мы в социальных сетях</div>
    </section>

    <!-- Галерея товаров -->
    <section class="gallery-section">
        <h1 class="gallery-title">Наши изделия</h1>
        
        <div class="gallery-images">
            <!-- Первая строка -->
            <img class="product-image large-image" src="img/ring-on-hand.png" alt="Кольцо на руке">
            <img class="product-image" src="img/rings-and-glasses.png" alt="Кольца и очки">
            <img class="product-image" src="img/amethyst.png" alt="Аметист">
            
            <!-- Вторая строка -->
            <img class="product-image" src="img/ring-in-box.png" alt="Кольцо в коробке">
            <img class="product-image" src="img/ring-and-watch.png" alt="Кольцо и часы">
            <img class="product-image large-image" src="img/ring-video.png" alt="Видео с кольцом">
        </div>
    </section>

    <!-- Рассылка на чёрном фоне -->
    <section class="newsletter-section">
        <div class="newsletter-container">
            <h2 class="newsletter-title">Полезные советы и персональные предложения</h2>
            <h3 class="newsletter-subtitle">Эксклюзивная рассылка</h3>
            
            <ul class="benefits-list">
                <li class="benefit-item">✓ Личный менеджер</li>
                <li class="benefit-item">✓ Доставка и оформление</li>
                <li class="benefit-item">✓ Индивидуальный дизайн</li>
            </ul>
            
            <form class="subscribe-form">
                <input class="email-input" type="email" placeholder="Ваш e-mail">
                <button class="submit-btn" type="submit">отправить</button>
            </form>
        </div>
    </section>

    <script>
        let likes = 0;
        let dislikes = 0;

        function like() {
            likes++;
            document.getElementById('likeCount').textContent = likes;
        }

        function dislike() {
            dislikes++;
            document.getElementById('dislikeCount').textContent = dislikes;
        }
    </script>
</body>

</html>
